<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300D09C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polygon points='16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="Groww Compass — Guided investment discovery and comparison prototype for Gen Z and first-time Indian investors." />
    <meta name="theme-color" content="#0D1117" id="theme-color-meta" />
    <title>Groww Compass — Investment Discovery</title>
    <!-- Prevent theme flash by applying saved theme or dark mode default before DOM paints -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('groww_compass_theme');
          var isDark = savedTheme ? savedTheme === 'dark' : true; // Dark mode is default
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0D1117');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#F8F9FA');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-surface-bg text-content-primary antialiased selection:bg-groww-emerald/30 selection:text-content-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
